<?xml version="1.0" encoding="UTF-8"?>
<!-- Engine test asset: clip paths (rect, path, evenodd clip-rule,
     objectBoundingBox units, clip on a group), transforms (rotate, skew,
     scale, matrix), group opacity, <use>, the style attribute, and two
     unsupported features (<text>, a filter) that must be skipped with a warning. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="480" height="360" viewBox="0 0 960 720">
  <defs>
    <clipPath id="window">
      <rect x="40" y="40" width="200" height="140" rx="30"/>
    </clipPath>
    <clipPath id="heart">
      <path d="M400 110 C400 60 340 40 320 80 C300 40 240 60 240 110 C240 160 320 200 320 220 C320 200 400 160 400 110 Z"
            transform="translate(40 0)"/>
    </clipPath>
    <clipPath id="donut" clip-rule="evenodd">
      <path d="M760 110 m-100 0 a100 100 0 1 0 200 0 a100 100 0 1 0 -200 0 m50 0 a50 50 0 1 0 100 0 a50 50 0 1 0 -100 0"/>
    </clipPath>
    <clipPath id="bbox-diamond" clipPathUnits="objectBoundingBox">
      <polygon points="0.5,0 1,0.5 0.5,1 0,0.5"/>
    </clipPath>
    <linearGradient id="rainbow" x1="0" x2="1">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.25" stop-color="#ffff00"/>
      <stop offset="0.5" stop-color="#00ff00"/>
      <stop offset="0.75" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <g id="tile">
      <rect width="60" height="60" style="fill:#264653;stroke:#e9c46a;stroke-width:6"/>
      <circle cx="30" cy="30" r="14" fill="#e76f51"/>
    </g>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- stripes seen through a rounded window -->
  <g clip-path="url(#window)">
    <rect x="0" y="0" width="300" height="220" fill="#a8dadc"/>
    <path d="M0 60 L300 0 M0 120 L300 60 M0 180 L300 120 M0 240 L300 180" stroke="#1d3557" stroke-width="18"/>
  </g>
  <!-- gradient + stroke clipped to a heart -->
  <rect x="270" y="40" width="200" height="200" fill="url(#rainbow)" stroke="#000" stroke-width="30"
        clip-path="url(#heart)"/>
  <!-- evenodd clip-rule leaves a hole -->
  <rect x="640" y="0" width="240" height="240" fill="#8338ec" clip-path="url(#donut)"/>

  <!-- bbox-unit clip on a shape -->
  <ellipse cx="140" cy="380" rx="100" ry="70" fill="#f4a261" clip-path="url(#bbox-diamond)"/>

  <!-- transforms -->
  <g transform="translate(320 300)">
    <rect x="0" y="0" width="80" height="80" fill="#e63946" transform="rotate(30 40 40)"/>
    <rect x="120" y="0" width="80" height="80" fill="#2a9d8f" transform="skewX(25)"/>
    <rect x="240" y="0" width="40" height="80" fill="#457b9d" transform="matrix(1.5 0.3 -0.2 1 60 0)"/>
  </g>

  <!-- group opacity (applied per shape) and nested transforms -->
  <g opacity="0.5" transform="translate(600 300) scale(1.2)">
    <circle cx="60" cy="60" r="50" fill="#ffbe0b"/>
    <circle cx="110" cy="60" r="50" fill="#3a86ff"/>
  </g>

  <!-- <use> references with offsets -->
  <use xlink:href="#tile" x="80" y="520"/>
  <use href="#tile" x="170" y="520" transform="rotate(15 200 550)"/>
  <use href="#tile" x="260" y="520" opacity="0.6"/>

  <!-- unsupported: skipped with a warning -->
  <text x="420" y="600" font-size="40">skipped</text>
  <rect x="420" y="620" width="120" height="60" fill="#06d6a0" filter="url(#blur)"/>
  <rect x="600" y="520" width="300" height="160" style="fill: none; stroke: #222; stroke-width: 4; stroke-dasharray: 16 8"/>
</svg>
