name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libegl1-mesa-dev libgl1-mesa-dri libgl1-mesa-dev libgles2-mesa-dev mesa-vulkan-drivers nodejs npm

      - name: Configure CMake (Release)
        run: cmake --preset release

      - name: Build Release Binaries
        run: cmake --build --preset release --target runtime editor cuervo_tools plm

      - name: Package Linux Archive
        run: |
          mkdir -p package/bin
          cp build/release/runtime/cuervo package/bin/
          cp build/release/editor/cuervo-editor package/bin/
          cp build/release/tools/cuervo_tools/cuervo-tools package/bin/
          cp build/release/pluma/plm package/bin/
          cp -r third_party/licenses package/
          cp LICENSE.md README.md THIRD_PARTY_NOTICES.md package/
          tar -czvf cuervo-linux-x86_64.tar.gz -C package .

      - name: Package VS Code Extension (.vsix)
        run: |
          cd tools/vscode-pluma
          npm install
          npm run package
          mv pluma-*.vsix ../../cuervo-vscode-pluma.vsix

      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cuervo-linux-x86_64.tar.gz
            cuervo-vscode-pluma.vsix
          draft: false
          prerelease: true
          generate_release_notes: true

      - name: Verify Release Artifacts (act test)
        if: ${{ env.ACT }}
        run: |
          echo "Running inside act: release package and vsix verified successfully!"
          ls -lh cuervo-linux-x86_64.tar.gz cuervo-vscode-pluma.vsix
