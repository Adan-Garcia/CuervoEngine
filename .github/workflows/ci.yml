name: CI

on:
  push:
    branches: [main, 'milestone-*'] # milestone branches are checked before they merge
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Linux (GCC / Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libegl1-mesa-dev libgl1-mesa-dri libgl1-mesa-dev libgles2-mesa-dev mesa-vulkan-drivers xvfb

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build All Targets
        run: cmake --build --preset debug

      - name: Run Test Suite (Headless)
        env:
          SDL_VIDEO_DRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: xvfb-run -a ctest --preset debug --output-on-failure --timeout 180

  # Milestone 10.5a (docs/WINDOWS.md): MSVC in Release (the configuration the
  # prebuilt players use; MSVC's Debug STL makes the suite about three times slower) and
  # MinGW-w64 GCC in Debug, each with zero warnings and the whole ctest suite.
  # Both build in C:\cb: the checkout drive (D:) runs out of space.
  test-windows-msvc:
    name: Windows (MSVC / Release)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install glslangValidator
        shell: pwsh
        run: |
          $url = "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip"
          Invoke-WebRequest -Uri $url -OutFile "glslang.zip"
          Expand-Archive -Path "glslang.zip" -DestinationPath "C:\tools\glslang"
          if (Test-Path "C:\tools\glslang\bin\glslang.exe") {
              Copy-Item "C:\tools\glslang\bin\glslang.exe" "C:\tools\glslang\bin\glslangValidator.exe"
          }
          echo "C:\tools\glslang\bin" >> $env:GITHUB_PATH

      - name: Install Mesa llvmpipe (software OpenGL; the runners have no GPU)
        shell: pwsh
        run: ./.github/scripts/install-mesa.ps1

      - name: Configure CMake
        run: cmake --preset msvc-release -B C:\cb

      - name: Build All Targets
        run: cmake --build C:\cb

      - name: Deploy Mesa opengl32.dll next to the programs
        shell: pwsh
        run: ./.github/scripts/install-mesa.ps1 -Deploy C:\cb

      - name: Run Test Suite
        run: ctest --test-dir C:\cb --output-on-failure --timeout 600

  test-windows-mingw:
    name: Windows (MinGW-w64 GCC / Debug)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64 (GCC, CMake, Ninja, glslang)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glslang

      - name: Install Mesa llvmpipe (software OpenGL; the runners have no GPU)
        shell: pwsh
        run: ./.github/scripts/install-mesa.ps1

      # Full DWARF debug info makes each MinGW Debug player about 140 MB, and the
      # tests copy players and AOT modules around until the runner's disk is
      # full. Line tables only (-g1) keeps a Debug build (assertions on).
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake --preset mingw-debug -B C:/cb -DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1

      - name: Build All Targets
        shell: msys2 {0}
        run: cmake --build C:/cb

      - name: Drop object files (disk space for the tests)
        shell: msys2 {0}
        run: |
          find /c/cb -name '*.obj' -delete
          df -h /c .

      - name: Deploy Mesa opengl32.dll next to the programs
        shell: pwsh
        run: ./.github/scripts/install-mesa.ps1 -Deploy C:\cb

      - name: Run Test Suite
        shell: msys2 {0}
        run: ctest --test-dir C:/cb --output-on-failure --timeout 600
