name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: Linux (GCC / Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libegl1-mesa-dev libgl1-mesa-dri libgl1-mesa-dev libgles2-mesa-dev mesa-vulkan-drivers xvfb

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build All Targets
        run: cmake --build --preset debug

      - name: Run Test Suite (Headless)
        env:
          SDL_VIDEO_DRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: xvfb-run -a ctest --preset debug --output-on-failure --timeout 180
