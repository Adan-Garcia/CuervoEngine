name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: Linux (GCC / Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libegl1-mesa-dev libgl1-mesa-dri libgl1-mesa-dev libgles2-mesa-dev mesa-vulkan-drivers xvfb

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build All Targets
        run: cmake --build --preset debug

      - name: Run Test Suite (Headless)
        env:
          SDL_VIDEO_DRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: xvfb-run -a ctest --preset debug --output-on-failure --timeout 180

  test-windows:
    name: Windows (MSVC / Debug)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install glslangValidator
        shell: pwsh
        run: |
          $url = "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip"
          Invoke-WebRequest -Uri $url -OutFile "glslang.zip"
          Expand-Archive -Path "glslang.zip" -DestinationPath "C:\tools\glslang"
          if (Test-Path "C:\tools\glslang\bin\glslang.exe") {
              Copy-Item "C:\tools\glslang\bin\glslang.exe" "C:\tools\glslang\bin\glslangValidator.exe"
          }
          echo "C:\tools\glslang\bin" >> $env:GITHUB_PATH

      - name: Install Mesa LLVMpipe (Software OpenGL)
        shell: pwsh
        run: |
          $url = "https://github.com/mmozeiko/build-mesa/releases/download/26.2.5/mesa-llvmpipe-x64-26.2.5.7z"
          Invoke-WebRequest -Uri $url -OutFile "mesa.7z"
          7z x mesa.7z -o"C:\tools\mesa"
          # System-wide OpenGL ICD registration for headless Windows Server VMs
          Copy-Item "C:\tools\mesa\opengl32.dll" -Destination "C:\Windows\System32\mesadrv.dll" -Force
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" -Name "DLL" -Value "mesadrv.dll"
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" -Name "DriverVersion" -Type DWord -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" -Name "Flags" -Type DWord -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" -Name "Version" -Type DWord -Value 2
          echo "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
          echo "CUERVO_PARITY_VULKAN=0" >> $env:GITHUB_ENV
          echo "C:\tools\mesa" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build All Targets
        run: cmake --build --preset debug

      - name: Deploy Mesa opengl32.dll to binary directories
        shell: pwsh
        run: |
          Get-ChildItem -Path "build\debug" -Recurse -Directory | ForEach-Object {
              Copy-Item "C:\tools\mesa\opengl32.dll" -Destination $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Run Test Suite
        run: ctest --preset debug --output-on-failure --timeout 360
