name: Bug Report
description: Report an unexpected crash, build failure, or incorrect engine/compiler behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise explanation of what the bug is.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Hardware
      description: Operating System, CPU, GPU, Driver version, and Backend (Vulkan / OpenGL / WebGL2).
      placeholder: "e.g., Linux x86-64, AMD Ryzen 7 5800X3D, RTX 3060 Ti (NVIDIA 550.x), Vulkan 1.3"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions or minimal Pluma code to reproduce the behavior.
      placeholder: |
        1. Run `cuervo --game examples/shmup`
        2. Press 'X' at tick ...
        3. See crash / panic
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output or Stack Trace
      description: Paste any compiler errors, panic messages, or terminal logs.
      render: shell
