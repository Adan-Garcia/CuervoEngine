# The orbit plugin's conformance project (docs/PLUGINS.md "Determinism"):
# `cuervo-tools plugin verify` packs it, runs it headless and compares its state
# hash with the one recorded when the plugin was published.
name = "orbit_conformance"
main = "Conformance"
virtual_size = [640, 360]
tick_rate = 60
seed = 1
render_tier = "compatible"

[dependencies.orbit]
path = ".."
version = "1.0.0"
