# Up to four players in one arena over the network (DESIGN.md 4.19)
#   relay:  cuervo --game examples/netarena --net-relay ws://host:8765 --net-room r --net-players 3
#   mesh:   cuervo --game examples/netarena --net-mesh 10.0.0.1:7001,10.0.0.2:7001,10.0.0.3:7001 --net-player 1
name = "netarena"
main = "Arena"
virtual_size = [640, 360]
tick_rate = 60
seed = 20261102
clear_color = "070a14"
render_tier = "compatible"

[input.actions]
left = ["Key.A", "Key.Left", "Pad.DpadLeft"]
right = ["Key.D", "Key.Right", "Pad.DpadRight"]
up = ["Key.W", "Key.Up", "Pad.DpadUp"]
down = ["Key.S", "Key.Down", "Pad.DpadDown"]
shoot = ["Key.Space", "Key.Z", "Pad.South"]
