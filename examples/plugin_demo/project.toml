# Native plugins (milestone 10.5c, docs/PLUGINS.md): nodes and functions
# from plugins written in C++ (orbit), Rust (noise) and C# (hues), used
# through `import` like any package. C# runs on desktop only.
# Build the plugins first: cmake --build build/debug --target example_plugins
#   cuervo --game examples/plugin_demo
name = "plugin_demo"
main = "Demo"
virtual_size = [1280, 720]
tick_rate = 60
seed = 1105
clear_color = "0e1020"
render_tier = "compatible"

[dependencies.orbit]       # C++
path = "../plugins/orbit"
version = "1.0.0"

[dependencies.noise]       # Rust
path = "../plugins/noise"
version = "1.0.0"

[dependencies.hues]        # C# (.NET, desktop)
path = "../plugins/hues"
version = "1.0.0"
